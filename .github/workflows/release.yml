name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.1.0 — without v prefix)'
        required: true
        type: string
      ref:
        description: 'Git ref to publish from (commit SHA, branch, or tag). Defaults to selected branch.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  publish-erlang:
    name: Publish Erlang Packages
    runs-on: ubuntu-latest
    env:
      HEX_API_KEY: ${{ secrets.HEX_PM_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          rebar3-version: '3'

      - name: Restore cache
        uses: actions/cache@v6
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: release-erlang-${{ runner.os }}-${{ hashFiles('rebar.lock') }}

      - name: Compile
        run: rebar3 compile

      - name: Publish to hex.pm
        run: |
          VERSION=$(sed -n 's/.*{vsn, *"\([^"]*\)".*/\1/p' src/beam_agent.app.src)
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://hex.pm/api/packages/beam_agent/releases/$VERSION")
          if [ "$STATUS" = "200" ]; then
            echo "beam_agent $VERSION already exists on hex.pm — skipping."
            exit 0
          fi
          rebar3 hex publish --yes

  publish-elixir:
    name: Publish Elixir Packages
    needs: publish-erlang
    runs-on: ubuntu-latest
    env:
      HEX_API_KEY: ${{ secrets.HEX_PM_TOKEN }}
      INPUT_VERSION: ${{ inputs.version }}
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          elixir-version: '1.19'

      - name: Install hex and rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Publish to hex.pm
        run: |
          # Manual dispatch: use provided version. Tag push: strip v prefix.
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${TAG_NAME#v}"
          fi

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://hex.pm/api/packages/beam_agent_ex/releases/$VERSION")
          if [ "$STATUS" = "200" ]; then
            echo "beam_agent_ex $VERSION already exists on hex.pm — skipping."
            exit 0
          fi

          # Swap the local path dep to a published hex dep for release.
          swap_dep() {
            local file="$1" name="$2" path_pattern="$3"
            # shellcheck disable=SC2001
            sed -i "s|{:${name}, path: \"${path_pattern}\"}|{:${name}, \"~> ${VERSION}\"}|g" "$file"
          }

          pushd beam_agent_ex
          swap_dep mix.exs beam_agent '..'
          mix deps.get
          mix hex.publish --yes
          popd
